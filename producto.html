<body class="bg-background text-on-background antialiased min-h-screen pb-[100px] flex justify-center">

<!-- Contextual Header -->

<a class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container/50 text-on-surface backdrop-blur-md active:scale-90 transition-transform" href="catalogo.html">

</a>
<div class="flex gap-2">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container/50 text-on-surface backdrop-blur-md active:scale-90 transition-transform">
<span class="material-symbols-outlined">favorite_border</span>
</button>
<a class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container/50 text-on-surface backdrop-blur-md active:scale-90 transition-transform relative" href="carrito.html">

</div>
</header>
<!-- Product Image Gallery -->
<section class="relative w-full aspect-[4/5] bg-surface-container-highest">
<div class="flex w-full h-full overflow-x-auto snap-x snap-mandatory no-scrollbar" id="gallery-track"></div>
<div class="absolute bottom-4 left-0 w-full flex justify-center gap-2" id="gallery-dots"></div>
</section>
<!-- Product Information -->
<section class="px-container-margin-mobile pt-stack-md pb-stack-lg flex flex-col gap-unit">
<div class="flex items-center gap-2 mb-1">
<span class="bg-surface-container-high text-on-surface-variant font-label-sm px-2 py-1 rounded-md border border-outline-variant/30 uppercase tracking-wider" id="product-category">&nbsp;</span>
<span class="flex items-center text-secondary-fixed font-label-sm gap-1">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span id="product-rating"></span>
</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background leading-tight" id="product-name"></h1>
<div class="flex items-end gap-3 mt-2">
<span class="font-headline-xl text-headline-xl text-secondary-fixed tracking-tight" id="product-price"></span>
<span class="font-body-md text-body-md text-on-surface-variant line-through mb-1" id="product-old-price"></span>
</div>
<div class="bg-surface-container rounded-lg p-3 mt-2 border border-secondary-fixed/20 flex items-center gap-3" id="installments-box">
<span class="material-symbols-outlined text-secondary-fixed">credit_card</span>
<p class="font-label-md text-label-md text-on-surface" id="installments-text"></p>
</div>
</section>
<!-- Selectors -->
<section class="px-container-margin-mobile pb-stack-lg flex flex-col gap-stack-md">
<!-- Variant Selector (aro/talla con precio distinto) -->
<div id="variant-section">
<div class="flex justify-between items-center mb-3">
<h3 class="font-label-md text-label-md text-on-surface">Elige tu opción:</h3>
</div>
<div class="grid grid-cols-2 gap-3" id="variant-options"></div>
</div>
<!-- Color Selector -->
<div id="color-section">
<div class="flex justify-between items-center mb-3">
<h3 class="font-label-md text-label-md text-on-surface">Color: <span class="text-on-surface-variant font-normal" id="selected-color-label"></span></h3>
</div>
<div class="flex gap-4" id="color-options"></div>
</div>
<!-- Size Selector -->
<div id="size-section">
<div class="flex justify-between items-center mb-3">
<h3 class="font-label-md text-label-md text-on-surface">Talla:</h3>
</div>
<div class="grid grid-cols-4 gap-3" id="size-options"></div>
<p class="font-label-sm text-label-sm text-secondary-fixed mt-3 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    Stock disponible
                </p>
</div>
</section>
<!-- Technical Specs -->
<section class="px-container-margin-mobile pb-stack-lg" id="specs-section">
<h3 class="font-headline-md text-headline-md text-on-surface mb-4">Especificaciones Técnicas</h3>
<div class="bg-surface-container rounded-xl overflow-hidden border border-outline-variant/50" id="specs-table"></div>
</section>
<!-- Description -->
<section class="px-container-margin-mobile pb-stack-lg">
<h3 class="font-headline-md text-headline-md text-on-surface mb-4">Descripción</h3>
<p class="font-body-md text-body-md text-on-surface-variant" id="product-description"></p>
</section>
<!-- Related Products -->
<section class="pl-container-margin-mobile pb-stack-xl">
<h3 class="font-headline-md text-headline-md text-on-surface mb-4 pr-container-margin-mobile">También te puede interesar</h3>
<div class="flex overflow-x-auto snap-x snap-mandatory gap-4 pb-4 no-scrollbar pr-4" id="related-products"></div>
</section>
<!-- WhatsApp FAB -->
<a class="fixed bottom-[110px] right-4 z-40 w-14 h-14 bg-secondary-fixed rounded-full shadow-[0_4px_20px_rgba(205,242,0,0.3)] flex items-center justify-center hover:scale-105 active:scale-95 transition-transform" href="https://wa.me/51993496607" id="whatsapp-fab" rel="noopener" target="_blank">

</svg>
</a>
<!-- Sticky Bottom Actions -->
<div class="fixed bottom-0 w-full max-w-[480px] bg-surface-container-high/95 backdrop-blur-md border-t border-outline-variant/30 p-4 z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
<div class="flex gap-3">
<button class="flex-1 bg-primary-container text-on-primary-container font-label-md text-label-md rounded-full py-3.5 flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-md" id="btn-add-cart">
<span class="material-symbols-outlined">add_shopping_cart</span>
                    Agregar al Carrito
                </button>
<button class="flex-1 bg-secondary-container text-on-secondary-container font-label-md text-label-md rounded-full py-3.5 font-bold flex items-center justify-center active:scale-95 transition-transform shadow-[0_0_15px_rgba(205,242,0,0.2)]" id="btn-buy-now">
                    Comprar ahora
                </button>
</div>
</div>
</main>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
        const params = new URLSearchParams(window.location.search);
        const product = getProductById(params.get('id')) || BICIFAST_PRODUCTS[0];
        let selectedColor = product.colors && product.colors[0] ? product.colors[0].name : null;
        let selectedSize = product.sizes && product.sizes.find((s) => !(product.unavailableSizes || []).includes(s)) || null;
        let selectedVariant = product.variants && product.variants[0] ? product.variants[0].label : null;

        function getSelectedColorObject() {
            return (product.colors || []).find((c) => c.name === selectedColor) || null;
        }

        function getSelectedVariantObject() {
            return (product.variants || []).find((v) => v.label === selectedVariant) || null;
        }

        function getCurrentPrice() {
            const variantObj = getSelectedVariantObject();
            return variantObj ? variantObj.price : product.price;
        }

        function getCurrentOldPrice() {
            const variantObj = getSelectedVariantObject();
            if (variantObj) return variantObj.oldPrice || null;
            return product.oldPrice || null;
        }

        function renderGallery() {
            const track = document.getElementById('gallery-track');
            const dots = document.getElementById('gallery-dots');
            const variantObj = getSelectedVariantObject();
            const colorObj = getSelectedColorObject();
            const images = (variantObj && variantObj.image)
                ? [variantObj.image]
                : (colorObj && colorObj.images && colorObj.images.length)
                ? colorObj.images
                : (product.gallery && product.gallery.length ? product.gallery : [product.image]);
            track.innerHTML = images.map((src) => `
                <div class="w-full h-full flex-shrink-0 snap-center relative">
                    <img alt="${product.name} - ${product.brand}${colorObj ? ' - color ' + colorObj.name : ''}" class="w-full h-full object-contain" src="${src}"/>
                </div>`).join('');
            dots.innerHTML = images.map((_, i) => `
                <div class="w-2 h-2 rounded-full ${i === 0 ? 'bg-secondary-fixed' : 'bg-on-surface-variant/40'}"></div>`).join('');
        }

        function renderVariants() {
            const section = document.getElementById('variant-section');
            if (!product.variants || product.variants.length === 0) {
                section.classList.add('hidden');
                return;
            }
            document.getElementById('variant-options').innerHTML = product.variants.map((v) => `
                <button data-variant="${v.label}" class="py-3 px-3 rounded-lg border ${v.label === selectedVariant ? 'border-2 border-secondary-fixed bg-secondary-container/10 text-secondary-fixed' : 'border-outline-variant bg-surface-container text-on-surface'} font-label-md text-label-md text-center active:scale-95 transition-all variant-option">
                    <span class="block">${v.label}</span>
                    <span class="block text-xs opacity-80 mt-0.5">${formatPEN(v.price)}</span>
                </button>`).join('');
            document.querySelectorAll('.variant-option').forEach((btn) => {
                btn.addEventListener('click', () => {
                    selectedVariant = btn.dataset.variant;
                    renderVariants();
                    renderGallery();
                    updatePriceDisplay();
                });
            });
        }

        function updatePriceDisplay() {
            document.getElementById('product-price').textContent = formatPEN(getCurrentPrice());
            const oldPrice = getCurrentOldPrice();
            document.getElementById('product-old-price').textContent = oldPrice ? formatPEN(oldPrice) : '';
            const installmentsBox = document.getElementById('installments-box');
            if (product.installments) {
                const months = parseInt((product.installments.match(/\d+/) || [12])[0], 10);
                const monthly = getCurrentPrice() / months;
                document.getElementById('installments-text').textContent = `${product.installments} de ${formatPEN(monthly)}`;
                installmentsBox.classList.remove('hidden');
            } else {
                installmentsBox.classList.add('hidden');
            }
        }

        function renderColors() {
            const section = document.getElementById('color-section');
            if (!product.colors || product.colors.length === 0) {
                section.classList.add('hidden');
                return;
            }
            document.getElementById('selected-color-label').textContent = selectedColor;
            document.getElementById('color-options').innerHTML = product.colors.map((c) => `
                <button data-color="${c.name}" class="w-12 h-12 rounded-full border-2 ${c.name === selectedColor ? 'border-secondary-fixed' : 'border-transparent'} p-1 flex items-center justify-center transition-transform active:scale-95 color-swatch">
                    <span class="w-full h-full rounded-full block relative overflow-hidden border border-white/10" style="background:${c.hex}">
                        ${c.accent ? `<span class="absolute top-0 right-0 w-1/2 h-full" style="background:${c.accent}"></span>` : ''}
                    </span>
                </button>`).join('');
            document.querySelectorAll('.color-swatch').forEach((btn) => {
                btn.addEventListener('click', () => {
                    selectedColor = btn.dataset.color;
                    renderColors();
                    renderGallery();
                });
            });
        }

        function renderSizes() {
            const section = document.getElementById('size-section');
            if (!product.sizes || product.sizes.length === 0) {
                section.classList.add('hidden');
                return;
            }
            const unavailable = product.unavailableSizes || [];
            document.getElementById('size-options').innerHTML = product.sizes.map((s) => {
                const isUnavailable = unavailable.includes(s);
                const isSelected = s === selectedSize;
                if (isUnavailable) {
                    return `<button disabled class="py-3 rounded-lg border border-outline-variant bg-surface-container/30 text-on-surface-variant font-label-md text-label-md text-center opacity-50 cursor-not-allowed">${s}</button>`;
                }
                return `<button data-size="${s}" class="size-option py-3 rounded-lg border ${isSelected ? 'border-2 border-secondary-fixed bg-secondary-container/10 text-secondary-fixed' : 'border-outline-variant bg-surface-container text-on-surface'} font-label-md text-label-md text-center active:scale-95 transition-all">${s}</button>`;
            }).join('');
            document.querySelectorAll('.size-option').forEach((btn) => {
                btn.addEventListener('click', () => {
                    selectedSize = btn.dataset.size;
                    renderSizes();
                });
            });
        }

        function renderSpecs() {
            const section = document.getElementById('specs-section');
            const entries = Object.entries(product.specs || {});
            if (entries.length === 0) {
                section.classList.add('hidden');
                return;
            }
            document.getElementById('specs-table').innerHTML = entries.map(([label, value], i) => `
                <div class="grid grid-cols-3 ${i < entries.length - 1 ? 'border-b border-outline-variant/30' : ''}">
                    <div class="p-3 bg-surface-container-high font-label-sm text-on-surface-variant">${label}</div>
                    <div class="p-3 col-span-2 font-body-md text-on-surface text-sm">${value}</div>
                </div>`).join('');
        }

        function renderRelated() {
            const others = BICIFAST_PRODUCTS.filter((p) => p.id !== product.id);
            const sameCategory = others.filter((p) => p.category === product.category);
            const rest = others.filter((p) => p.category !== product.category);
            const related = sameCategory.concat(rest).slice(0, 4);
            document.getElementById('related-products').innerHTML = related.map((p) => `
                <a href="producto.html?id=${p.id}" class="w-[180px] flex-shrink-0 snap-start bg-surface-container rounded-xl overflow-hidden border border-outline-variant/30 shadow-sm relative group block">
                    <div class="h-[140px] bg-surface-container-highest relative p-2">
                        <img alt="${p.name}" class="w-full h-full object-contain" src="${p.image}"/>
                    </div>
                    <div class="p-3">
                        <h4 class="font-label-md text-label-md text-on-surface line-clamp-2 mb-2">${p.name}</h4>
                        <p class="font-label-md text-label-md text-secondary-fixed">${formatPEN(p.price)}</p>
                    </div>
                </a>`).join('');
        }

        function updateSEO() {
            const pageUrl = `https://bicifast.vercel.app/producto.html?id=${product.id}`;
            const seoTitle = `${product.name} - ${product.categoryLabel} | BiciFast`;
            const seoDescription = product.short || product.description;
            const absoluteImage = new URL(product.image, 'https://bicifast.vercel.app/').href;

            document.title = seoTitle;
            document.getElementById('meta-description').setAttribute('content', seoDescription);
            document.getElementById('canonical-link').setAttribute('href', pageUrl);
            document.getElementById('og-title').setAttribute('content', seoTitle);
            document.getElementById('og-description').setAttribute('content', seoDescription);
            document.getElementById('og-url').setAttribute('content', pageUrl);
            document.getElementById('og-image').setAttribute('content', absoluteImage);
            document.getElementById('twitter-title').setAttribute('content', seoTitle);
            document.getElementById('twitter-description').setAttribute('content', seoDescription);

            const jsonLd = {
                "@context": "https://schema.org",
                "@type": "Product",
                "name": product.name,
                "brand": { "@type": "Brand", "name": product.brand },
                "category": product.categoryLabel,
                "description": product.description,
                "image": (product.gallery && product.gallery.length ? product.gallery : [product.image]).map((src) => new URL(src, 'https://bicifast.vercel.app/').href),
                "offers": {
                    "@type": "Offer",
                    "url": pageUrl,
                    "priceCurrency": "PEN",
                    "price": getCurrentPrice(),
                    "availability": "https://schema.org/InStock"
                }
            };

            let script = document.getElementById('product-jsonld');
            if (!script) {
                script = document.createElement('script');
                script.type = 'application/ld+json';
                script.id = 'product-jsonld';
                document.head.appendChild(script);
            }
            script.textContent = JSON.stringify(jsonLd);
        }

        function renderProduct() {
            updateSEO();
            document.getElementById('product-category').textContent = product.categoryLabel;
            document.getElementById('product-rating').textContent = `${product.rating} (${product.reviews})`;
            document.getElementById('product-name').textContent = product.name;
            document.getElementById('product-description').textContent = product.description;
            document.getElementById('whatsapp-fab').href = `https://wa.me/51993496607?text=${encodeURIComponent('Hola, quiero consultar por la ' + product.name)}`;

            updatePriceDisplay();
            renderVariants();
            renderGallery();
            renderColors();
            renderSizes();
            renderSpecs();
            renderRelated();
        }

        document.getElementById('btn-add-cart').addEventListener('click', () => {
            addToCart(product.id, { color: selectedColor, size: selectedSize, variant: selectedVariant, qty: 1 });
        });

        document.getElementById('btn-buy-now').addEventListener('click', () => {
            addToCart(product.id, { color: selectedColor, size: selectedSize, variant: selectedVariant, qty: 1 });
            window.location.href = 'carrito.html';
        });

        renderProduct();
    </script>
</body></html>
